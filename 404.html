<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Код без ошибок</title>
  <meta name="robots" content="noindex">
  <script>
    /* Та же тема, что выбрана на сайте: светлая по умолчанию или тёмная */
    (function () {
      var t = null;
      try { t = localStorage.getItem("atk-kbo:theme"); } catch (e) { t = null; }
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
  <style>
    :root { --paper: #f5f6fb; --grid: #e3e6f3; --ink: #1b1840; --ink-2: #4a4770; --violet: #5b3df5; --noise: #c2185b; color-scheme: light; }
    :root[data-theme="dark"] { --paper: #121129; --grid: #1d1b3c; --ink: #edebff; --ink-2: #b9b5de; --violet: #a797ff; --noise: #ff7aae; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      font-family: "Golos Text", "Inter", system-ui, sans-serif; color: var(--ink); background-color: var(--paper);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
    main { max-width: 34rem; }
    .code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 3rem; font-weight: 700; letter-spacing: .1em; margin: 0; }
    .code span { color: var(--noise); text-decoration: underline wavy; }
    h1 { font-size: 1.6rem; margin: .3em 0; }
    p { line-height: 1.6; color: var(--ink-2); }
    a, button { display: inline-block; margin: 6px 8px 0 0; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--ink);
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    a { background: var(--ink); color: var(--paper); }
    button { background: transparent; color: var(--ink); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">4<span>0</span>4</p>
    <h1>Такой страницы нет</h1>
    <p>Похоже, в адресе ошибка, которую не исправить даже кодом Хемминга. Возможно, страница ещё не готова: материалы модулей появляются по ходу подготовки.</p>
    <a id="home-link" href="./">На главную</a>
    <button type="button" onclick="history.back()">Назад</button>
  </main>
  <script>
    /* На GitHub Pages сайт проекта живёт по адресу /имя-репозитория/. Ведём на его главную. */
    (function () {
      var host = location.hostname;
      var parts = location.pathname.split("/").filter(Boolean);
      var home = "/";
      if (/\.github\.io$/.test(host) && parts.length && host.split(".")[0] !== parts[0]) home = "/" + parts[0] + "/";
      document.getElementById("home-link").href = home;
    })();
  </script>
</body>
</html>
